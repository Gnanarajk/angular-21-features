<input
  type="text"
  [value]="store.query()"
  (input)="store.setQuery($any($event.target).value)"
  placeholder="Search shipments..."
  class="search-input"
/>

<app-shipment-list
  [shipments]="store.displayShipments()"
  [deletingIds]="deletingIds()"
  [isLoading]="store.isBusy()"
  [isSearchMode]="store.isSearchMode()"
  (deleteRequest)="onDelete($event)"
/>
